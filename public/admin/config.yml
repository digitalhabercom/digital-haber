                widget: object
                collapsed: true
                fields:
                  - { label: "AdSense reklam birimi numarası", name: slot, widget: string, required: false, hint: "AdSense'ten aldığınız birim numarası (sadece rakamlar). Boşsa bu alanda AdSense reklamı gösterilmez." }
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Doğrudan reklam verenin görseli. Doluysa AdSense yerine bu gösterilir." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML/script kodunu olduğu gibi yapıştırın. Doluysa banner ve AdSense yerine bu gösterilir." }
              - label: "Sol kenar (geniş ekranlarda)"
                name: sol-kenar
                widget: object
                collapsed: true
                fields:
                  - { label: "AdSense reklam birimi numarası", name: slot, widget: string, required: false, hint: "AdSense'ten aldığınız birim numarası (sadece rakamlar). Boşsa bu alanda AdSense reklamı gösterilmez." }
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Doğrudan reklam verenin görseli. Doluysa AdSense yerine bu gösterilir." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML/script kodunu olduğu gibi yapıştırın. Doluysa banner ve AdSense yerine bu gösterilir." }
              - label: "Sağ kenar (geniş ekranlarda)"
                name: sag-kenar
                widget: object
                collapsed: true
                fields:
                  - { label: "AdSense reklam birimi numarası", name: slot, widget: string, required: false, hint: "AdSense'ten aldığınız birim numarası (sadece rakamlar). Boşsa bu alanda AdSense reklamı gösterilmez." }
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Doğrudan reklam verenin görseli. Doluysa AdSense yerine bu gösterilir." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML/script kodunu olduğu gibi yapıştırın. Doluysa banner ve AdSense yerine bu gösterilir." }
              - label: "Yan sütun üst"
                name: yan-ust
                widget: object
                collapsed: true
                fields:
                  - { label: "AdSense reklam birimi numarası", name: slot, widget: string, required: false, hint: "AdSense'ten aldığınız birim numarası (sadece rakamlar). Boşsa bu alanda AdSense reklamı gösterilmez." }
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Doğrudan reklam verenin görseli. Doluysa AdSense yerine bu gösterilir." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML/script kodunu olduğu gibi yapıştırın. Doluysa banner ve AdSense yerine bu gösterilir." }
              - label: "Yan sütun alt (kayarken sabit kalır)"
                name: yan-alt
                widget: object
                collapsed: true
                fields:
                  - { label: "AdSense reklam birimi numarası", name: slot, widget: string, required: false, hint: "AdSense'ten aldığınız birim numarası (sadece rakamlar). Boşsa bu alanda AdSense reklamı gösterilmez." }
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Doğrudan reklam verenin görseli. Doluysa AdSense yerine bu gösterilir." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML/script kodunu olduğu gibi yapıştırın. Doluysa banner ve AdSense yerine bu gösterilir." }

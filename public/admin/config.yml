                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML/script kodunu olduğu gibi yapıştırın. Doluysa banner ve AdSense yerine bu gösterilir." }

      - name: yazarlar
        label: Yazarlar
        file: src/data/yazarlar.json
        fields:
          - label: Yazarlar
            name: authors
            widget: list
            summary: "{{fields.name}}"
            hint: "Her yazar için haberin altında yazar kutusu ve ayrı bir yazar sayfası oluşur (arama motorlarına güven sinyali verir). Haberdeki yazar adı buradaki adla birebir aynı olmalıdır."
            fields:
              - { label: Ad Soyad, name: name, widget: string }
              - { label: Kod (slug), name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "Sadece küçük harf, rakam ve tire (örn: ali-yilmaz)"], hint: "Yazar sayfasının adresi: /yazar/ali-yilmaz/. Sonradan değiştirmeyin." }
              - { label: Görevi, name: role, widget: string, required: false, hint: "Örn: Teknoloji editörü" }
              - { label: "Görevi (İngilizce)", name: role_en, widget: string, required: false }
              - { label: Kısa tanıtım, name: bio, widget: text, required: false, hint: "1-2 cümle: uzmanlık alanı ve deneyim." }
              - { label: "Kısa tanıtım (İngilizce)", name: bio_en, widget: text, required: false }
              - { label: Fotoğraf, name: photo, widget: image, required: false }

      - name: site
        label: Site Ayarları
        file: src/data/site.json
        fields:
          - { label: "Google Search Console doğrulama kodu", name: googleDogrulama, widget: string, required: false, hint: "Search Console > Mülk ekle > URL öneki > HTML etiketi yöntemindeki content=\"...\" değeri (sadece kod kısmı)." }
          - { label: "Bing Webmaster doğrulama kodu", name: bingDogrulama, widget: string, required: false, hint: "Bing Webmaster Tools'taki HTML meta etiketi yöntemindeki content değeri." }
          - { label: "Yandex Webmaster doğrulama kodu", name: yandexDogrulama, widget: string, required: false, hint: "Yandex Webmaster'daki meta etiket yönteminin content değeri." }
          - { label: "Cloudflare Web Analytics anahtarı (token)", name: cloudflareAnalitikToken, widget: string, required: false, hint: "Ücretsiz ziyaretçi istatistiği. Cloudflare > Web Analytics > site ekle > JS snippet içindeki token değeri." }
          - { label: "Görsel optimizasyonu (Cloudflare)", name: gorselOptimizasyon, widget: boolean, default: false, hint: "Yalnızca Cloudflare > Images > Transformations açıkken (ücretsiz plan 5.000 dönüşüm/ay) açın. Açıkken yüklenen görseller küçük boyutlu WebP olarak sunulur, site hızlanır." }
          - label: "Sosyal hesaplar"
            name: sosyal
            widget: object
            hint: "Tam adres yazın (https://...). Boş bırakılan görünmez."
            fields:
              - { label: X (Twitter), name: x, widget: string, required: false }
              - { label: Telegram kanalı, name: telegram, widget: string, required: false }

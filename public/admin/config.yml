# Editör paneli ayarları (Sveltia CMS)
backend:
  name: github
  repo: digitalhabercom/digital-haber
  branch: main

# Panelden yüklenen görseller (manşet ve banner görselleri dahil) buraya kaydedilir, sitede /uploads/... adresiyle yayınlanır
media_folder: public/uploads
public_folder: /uploads

locale: tr

# Başlıktan temiz, Türkçe karaktersiz adres üretir: "Yapay Zekâ Çağı" -> yapay-zeka-cagi
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: haberler
    label: Haberler
    label_singular: Haber
    folder: src/content/haberler
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} ({{category}})"
    sortable_fields: ["date", "title", "category"]
    view_filters:
      - { label: Türkçe haberler, field: dil, pattern: tr }
      - { label: İngilizce haberler, field: dil, pattern: en }
    fields:
      - { label: Başlık, name: title, widget: string, hint: "Net bir başlık yazın. Google için 60-70 karakter idealdir." }
      - { label: Kısa Açıklama (Spot), name: description, widget: text, hint: "Haberin özeti. Google sonuçlarında ve paylaşımlarda görünür (150-160 karakter ideal)." }
      - { label: "İçerik türü", name: tur, widget: select, default: haber, options: [{ label: Haber, value: haber }, { label: Analiz, value: analiz }, { label: Rehber, value: rehber }, { label: Karşılaştırma, value: karsilastirma }, { label: İnceleme, value: inceleme }], hint: "Haber dışındaki türler kartlarda ve haberde rozet olarak görünür; üst menüde Rehberler gibi ayrı sayfalar açılır." }
      - { label: Kategori, name: category, widget: relation, collection: ayarlar, file: kategoriler, value_field: "categories.*.slug", display_fields: ["categories.*.name"], search_fields: ["categories.*.name"], hint: "Kategori listesi Ayarlar bölümündeki Kategoriler'den gelir." }
      - { label: Manşet / Kapak Görseli, name: image, widget: image, hint: "Bilgisayarınızdan yükleyin. 1600 piksel genişlikte, 300 KB altında bir görsel siteyi hızlı tutar. Manşet için yatay (16:10) görsel seçin." }
      - { label: Görsel Açıklaması (alt), name: imageAlt, widget: string, required: false, hint: "Görselde ne olduğunu kısaca yazın (arama motorları ve ekran okuyucular için)." }
      - { label: Görsel Altyazısı, name: imageCaption, widget: string, required: false, hint: "Görselin altında görünen kısa açıklama. Boş bırakabilirsiniz." }
      - { label: Görsel Kaynağı, name: imageCredit, widget: string, required: false, hint: "Örn: Unsplash / Ad Soyad. Haber sayfasında görselin altında görünür." }
      - { label: Yayın Tarihi, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "DD.MM.YYYY", time_format: "HH:mm" }
      - { label: Yazar, name: author, widget: relation, collection: ayarlar, file: yazarlar, value_field: "authors.*.name", display_fields: ["authors.*.name"], search_fields: ["authors.*.name"], default: "digitalhaber Editör", hint: "Yazar listesi Ayarlar > Yazarlar bölümünden gelir. Haberin altında yazar kutusu ve yazar sayfası oluşur." }
      - { label: Manşette Göster, name: featured, widget: boolean, default: false, hint: "Açıksa ana sayfadaki manşete girer (en fazla 5 haber gösterilir)." }
      - { label: En Çok Okunanlarda Göster, name: popular, widget: boolean, default: false }
      - { label: Taslak, name: draft, widget: boolean, default: false, hint: "Açıksa haber sitede yayınlanmaz." }
      - { label: Etiketler, name: tags, widget: list, required: false, hint: "Her etiket için bir giriş ekleyin. Etiket sayfaları otomatik oluşur." }
      - { label: Güncelleme Tarihi, name: updated, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", required: false, hint: "Haberi sonradan düzelttiyseniz doldurun." }
      - { label: Kısaca (özet maddeleri), name: summary, widget: list, required: false, hint: "2-4 kısa madde. Haberin başında Kısaca kutusu olarak görünür; okuyucuya ve arama/yapay zekâ motorlarına hızlı özet verir." }
      - label: "Sık sorulan sorular"
        name: faq
        widget: list
        required: false
        hint: "İsteğe bağlı. 2-3 soru-cevap ekleyin; haber altında görünür, Google ve yapay zekâ araçları doğrudan alıntılayabilir."
        fields:
          - { label: "Soru", name: q, widget: string }
          - { label: "Cevap", name: a, widget: text }
      - { label: "Kaynak", name: source, widget: string, required: false, hint: "Haberin dayandığı kaynak (ör. The Verge). Haber altında ve Google'a güven işareti olarak görünür." }
      - { label: "Kaynak bağlantısı", name: sourceUrl, widget: string, required: false, hint: "Kaynağın tam adresi (https://...)." }
      - { label: "Dil", name: dil, widget: select, options: [{ label: "Türkçe (digitalhaber.com)", value: tr }, { label: "İngilizce (digitalhaber.com/en)", value: en }], default: tr, hint: "Haberin yayınlanacağı site: Türkçe ya da İngilizce." }
      - { label: "Karşılığı olan Türkçe haber (yalnızca İngilizce haberde)", name: translationOf, widget: relation, collection: haberler, value_field: "{{slug}}", search_fields: ["title"], display_fields: ["title"], required: false, hint: "İngilizce haberse hangi Türkçe haberin çevirisi? Seçerseniz iki sayfa dil bağlantısıyla (hreflang) bağlanır. Türkçe haberde boş bırakın." }
      - { label: Haber Metni, name: body, widget: markdown, hint: "Video eklemek için YouTube veya Vimeo bağlantısını boş bir satıra tek başına yapıştırın; haberde video olarak görünür. Bilgi kutusu için alıntıyı '> **Bilgi:** ...' diye başlatın." }

  - name: ayarlar
    label: Ayarlar
    files:
      - name: kategoriler
        label: Kategoriler
        file: src/data/kategoriler.json
        fields:
          - label: Kategoriler
            name: categories
            widget: list
            summary: "{{fields.name}}"
            hint: "Sıralama menüdeki sıradır. Haberi olmayan kategori menüde görünmez."
            fields:
              - { label: Ad, name: name, widget: string, hint: "Menüde görünen ad. Örn: Mobil" }
              - { label: Kod (slug), name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "Sadece küçük harf, rakam ve tire kullanın (örn: bilim-teknoloji)"], hint: "Adres kodu. Küçük harf, Türkçe karakter yok. Haber eklendikten sonra değiştirmeyin." }
              - { label: Renk, name: color, widget: color, default: "#2455d6", hint: "Kategori etiketinin rengi. Beyaz yazı okunsun diye koyu bir ton seçin." }
              - { label: Açıklama, name: desc, widget: text, required: false, hint: "Kategori sayfasında ve Google'da görünür." }
              - { label: "Ad (İngilizce)", name: name_en, widget: string, required: false, hint: "İngilizce sitede görünen ad. Örn: Mobile" }
              - { label: "Açıklama (İngilizce)", name: desc_en, widget: text, required: false }

      - name: reklam
        label: Reklam Ayarları
        file: src/data/reklam.json
        fields:
          - { label: "Reklam yerlerini boş kutu olarak göster", name: showPlaceholders, widget: boolean, default: false, hint: "Reklam yerlerini görmek için açın. Yayına almadan önce kapatın." }
          - label: "Reklam alanları"
            name: alanlar
            widget: object
            hint: "Her alana kendi banner'ınızı (görsel + bağlantı) ya da reklam verenin HTML kodunu girin. Öncelik: HTML kodu, banner. Boş alan sitede görünmez."
            fields:
              - label: "Üst (her sayfanın en üstü)"
                name: ust
                widget: object
                collapsed: true
                fields:
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Reklam verenin görseli (yükleyin). Doluysa görsele tıklanınca bağlantı açılır." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML kodunu olduğu gibi yapıştırın. Doluysa banner yerine bu gösterilir." }
              - label: "Manşet altı (ana sayfa)"
                name: manset-alti
                widget: object
                collapsed: true
                fields:
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Reklam verenin görseli (yükleyin). Doluysa görsele tıklanınca bağlantı açılır." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML kodunu olduğu gibi yapıştırın. Doluysa banner yerine bu gösterilir." }
              - label: "Ana sayfa ortası"
                name: anasayfa-orta
                widget: object
                collapsed: true
                fields:
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Reklam verenin görseli (yükleyin). Doluysa görsele tıklanınca bağlantı açılır." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML kodunu olduğu gibi yapıştırın. Doluysa banner yerine bu gösterilir." }
              - label: "Sol kenar (geniş ekranlarda)"
                name: sol-kenar
                widget: object
                collapsed: true
                fields:
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Reklam verenin görseli (yükleyin). Doluysa görsele tıklanınca bağlantı açılır." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML kodunu olduğu gibi yapıştırın. Doluysa banner yerine bu gösterilir." }
              - label: "Sağ kenar (geniş ekranlarda)"
                name: sag-kenar
                widget: object
                collapsed: true
                fields:
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Reklam verenin görseli (yükleyin). Doluysa görsele tıklanınca bağlantı açılır." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML kodunu olduğu gibi yapıştırın. Doluysa banner yerine bu gösterilir." }
              - label: "Yan sütun üst"
                name: yan-ust
                widget: object
                collapsed: true
                fields:
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Reklam verenin görseli (yükleyin). Doluysa görsele tıklanınca bağlantı açılır." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML kodunu olduğu gibi yapıştırın. Doluysa banner yerine bu gösterilir." }
              - label: "Yan sütun alt (kayarken sabit kalır)"
                name: yan-alt
                widget: object
                collapsed: true
                fields:
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Reklam verenin görseli (yükleyin). Doluysa görsele tıklanınca bağlantı açılır." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML kodunu olduğu gibi yapıştırın. Doluysa banner yerine bu gösterilir." }
              - label: "Haber içi 1 (2. paragraftan sonra)"
                name: haber-ici-1
                widget: object
                collapsed: true
                fields:
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Reklam verenin görseli (yükleyin). Doluysa görsele tıklanınca bağlantı açılır." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML kodunu olduğu gibi yapıştırın. Doluysa banner yerine bu gösterilir." }
              - label: "Haber içi 2 (uzun haberlerde 6. paragraftan sonra)"
                name: haber-ici-2
                widget: object
                collapsed: true
                fields:
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Reklam verenin görseli (yükleyin). Doluysa görsele tıklanınca bağlantı açılır." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML kodunu olduğu gibi yapıştırın. Doluysa banner yerine bu gösterilir." }
              - label: "Haber sonu"
                name: haber-sonu
                widget: object
                collapsed: true
                fields:
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Reklam verenin görseli (yükleyin). Doluysa görsele tıklanınca bağlantı açılır." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML kodunu olduğu gibi yapıştırın. Doluysa banner yerine bu gösterilir." }
              - label: "Alt (alt bilginin üstü)"
                name: alt
                widget: object
                collapsed: true
                fields:
                  - { label: "Kendi banner görseliniz", name: banner, widget: image, required: false, hint: "Reklam verenin görseli (yükleyin). Doluysa görsele tıklanınca bağlantı açılır." }
                  - { label: "Banner bağlantısı", name: link, widget: string, required: false, hint: "Banner'a tıklanınca gidilecek adres (https://...)." }
                  - { label: "Banner açıklaması", name: alt, widget: string, required: false }
                  - { label: "Özel reklam HTML kodu", name: html, widget: text, required: false, hint: "Reklam verenin verdiği HTML kodunu olduğu gibi yapıştırın. Doluysa banner yerine bu gösterilir." }

      - name: yazarlar
        label: Yazarlar
        file: src/data/yazarlar.json
        fields:
          - label: Yazarlar
            name: authors
            widget: list
            summary: "{{fields.name}}"
            hint: "Her yazar için haberin altında yazar kutusu ve ayrı bir yazar sayfası oluşur (arama motorlarına güven sinyali verir). Haberdeki yazar adı buradaki adla birebir aynı olmalıdır."
            fields:
              - { label: Ad Soyad, name: name, widget: string }
              - { label: Kod (slug), name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "Sadece küçük harf, rakam ve tire (örn: ali-yilmaz)"], hint: "Yazar sayfasının adresi: /yazar/ali-yilmaz/. Sonradan değiştirmeyin." }
              - { label: Görevi, name: role, widget: string, required: false, hint: "Örn: Teknoloji editörü" }
              - { label: "Görevi (İngilizce)", name: role_en, widget: string, required: false }
              - { label: Kısa tanıtım, name: bio, widget: text, required: false, hint: "1-2 cümle: uzmanlık alanı ve deneyim." }
              - { label: "Kısa tanıtım (İngilizce)", name: bio_en, widget: text, required: false }
              - { label: Fotoğraf, name: photo, widget: image, required: false }

      - name: site
        label: Site Ayarları
        file: src/data/site.json
        fields:
          - { label: "Google Search Console doğrulama kodu", name: googleDogrulama, widget: string, required: false, hint: "Search Console > Mülk ekle > URL öneki > HTML etiketi yöntemindeki content=\"...\" değeri (sadece kod kısmı)." }
          - { label: "Bing Webmaster doğrulama kodu", name: bingDogrulama, widget: string, required: false, hint: "Bing Webmaster Tools'taki HTML meta etiketi yöntemindeki content değeri." }
          - { label: "Yandex Webmaster doğrulama kodu", name: yandexDogrulama, widget: string, required: false, hint: "Yandex Webmaster'daki meta etiket yönteminin content değeri." }
          - { label: "Cloudflare Web Analytics anahtarı (token)", name: cloudflareAnalitikToken, widget: string, required: false, hint: "Ücretsiz ziyaretçi istatistiği. Cloudflare > Web Analytics > site ekle > JS snippet içindeki token değeri." }
          - { label: "Görsel optimizasyonu (Cloudflare)", name: gorselOptimizasyon, widget: boolean, default: false, hint: "Yalnızca Cloudflare > Images > Transformations açıkken (ücretsiz plan 5.000 dönüşüm/ay) açın. Açıkken yüklenen görseller küçük boyutlu WebP olarak sunulur, site hızlanır." }
          - { label: "OneSignal App ID (web bildirimi)", name: onesignalAppId, widget: string, required: false, hint: "Ücretsiz web push bildirimi. onesignal.com > yeni uygulama > Web > Custom Code > site adresi digitalhaber.com. Oradaki App ID'yi buraya yapıştırın. Boşsa bildirim kapalıdır." }
          - { label: "E-posta bülteni başlığı", name: bultenBaslik, widget: string, required: false, hint: "Boşsa varsayılan başlık kullanılır." }
          - { label: "E-posta bülteni formu (Brevo HTML kodu)", name: bultenHtml, widget: text, required: false, hint: "Brevo > Kayıt formları > formu oluşturun > Embed / HTML kodunu yapıştırın. Boşsa kutu görünmez." }
          - label: "Sosyal hesaplar"
            name: sosyal
            widget: object
            hint: "Tam adres yazın (https://...). Boş bırakılan görünmez."
            fields:
              - { label: X (Twitter), name: x, widget: string, required: false }
              - { label: Telegram kanalı, name: telegram, widget: string, required: false }
              - { label: WhatsApp kanalı, name: whatsapp, widget: string, required: false }
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: YouTube, name: youtube, widget: string, required: false }
